name: Build JPE Profiler

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --no-daemon

      # Artifact upload is intentionally omitted: this repository's GitHub
      # Actions artifact storage quota is currently exhausted. The build
      # itself remains the CI success criterion.
