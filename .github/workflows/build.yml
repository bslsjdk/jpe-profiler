name: Build JPE Profiler

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --no-daemon

      - name: Upload test mod
        if: success()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: jpe-profiler-test-\${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1
