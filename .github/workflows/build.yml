name: Build and Server Smoke Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        run: gradle build --no-daemon

      - name: Upload test mod
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: jpe-profiler-test-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  dedicated-server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare disposable server
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          server-port=25565
          online-mode=false
          level-name=jpe-profiler-ci-world
          level-seed=8675309
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-tick-time=-1
          EOF

      - name: Start server, force-generate fresh chunks, and verify telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, time

          root = pathlib.Path.cwd()
          run_dir = root / "run" / "server"
          log_path = run_dir / "logs" / "latest.log"
          proc = subprocess.Popen(
              ["gradle", "runServer", "--no-daemon", "--console=plain"],
              cwd=root, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT, text=True, bufsize=1
          )

          captured = []
          ready = False
          deadline = time.time() + 420
          while time.time() < deadline:
              line = proc.stdout.readline()
              if line:
                  captured.append(line)
                  print(line, end="")
                  if "Done (" in line and "For help, type" in line:
                      ready = True
                      break
              elif proc.poll() is not None:
                  break
              else:
                  time.sleep(0.2)

          if not ready:
              proc.terminate()
              raise SystemExit("Dedicated server did not reach the ready state.")

          def command(value):
              print("[CI COMMAND]", value)
              proc.stdin.write(value + "\n")
              proc.stdin.flush()

          # 16x16 = 256 block-coordinate cells, within vanilla's forceload cap.
          # The disposable seed/world guarantees these are new chunks on a clean CI run.
          command("forceload add 0 0 240 240")
          time.sleep(75)
          command("forceload remove all")
          time.sleep(3)
          command("stop")

          try:
              proc.wait(timeout=90)
          except subprocess.TimeoutExpired:
              proc.terminate()
              raise SystemExit("Dedicated server did not stop cleanly.")

          if proc.returncode != 0:
              raise SystemExit(f"Dedicated server exited with code {proc.returncode}")

          output_dir = run_dir / "logs" / "jpe-profiler"
          event_files = sorted(output_dir.glob("events-*.csv"))
          runtime_files = sorted(output_dir.glob("runtime-*.csv"))
          if not event_files or not runtime_files:
              raise SystemExit("Profiler CSV files were not created by the dedicated server.")

          events = event_files[-1].read_text(encoding="utf-8").splitlines()
          if len(events) < 2:
              raise SystemExit("Events CSV contains no sampled data rows.")

          header = events[0].split(",")
          row = events[-1].split(",")
          if "new_chunk_loads" not in header:
              raise SystemExit("Events CSV is missing new_chunk_loads column.")
          index = header.index("new_chunk_loads")
          generated = sum(int(line.split(",")[index]) for line in events[1:] if line.strip())
          print(f"Verified generated chunk load events: {generated}")
          if generated <= 0:
              raise SystemExit("Server smoke test did not observe any newly generated chunk loads.")

          print(f"Verified profiler output directory: {output_dir}")
          PY

      - name: Upload server smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: jpe-profiler-server-smoke-${{ github.sha }}
          path: |
            run/server/logs/latest.log
            run/server/logs/jpe-profiler/*.csv
          if-no-files-found: warn
          retention-days: 3
